    "numpy>=2.4.4",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "torch>=2.8.0",
    "transformers>=4.50.0",
]
